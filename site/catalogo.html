<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | FanVerse</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="catalogo">
    <header class="topbar">
      <div class="container navbar">
        <a href="index.html" class="brand">
          <span class="brand-mark">F</span>
          <span>FanVerse</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Início</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="colecao.html?id=cronicas-da-baluarte">Coleções</a>
          <a href="loja.html">Loja</a>
          <a href="autor.html">Autor</a>
        </nav>
        <div class="nav-actions">
          <button id="theme-toggle" class="button-secondary">Modo claro</button>
        </div>
      </div>
    </header>

    <main class="container section">
      <div class="section-head">
        <h2>Catálogo</h2>
      </div>
      <div class="catalog-tools">
        <input id="catalog-search" class="search-box" type="search" placeholder="Pesquisar por título, arco ou coleção..." />
        <select id="tipo-filtro" class="filter-box">
          <option value="todos">Todos os tipos</option>
          <option value="digital">Digital</option>
          <option value="fisico">Físico</option>
        </select>
        <select id="status-filtro" class="filter-box">
          <option value="todos">Todas as disponibilidades</option>
          <option value="DIGITAL_DISPONIVEL">Digital disponível</option>
          <option value="FISICO_EM_BREVE">Físico em breve</option>
        </select>
        <a class="button" href="loja.html">Ir para loja</a>
      </div>
      <div id="catalog-list" class="grid-3"></div>
    </main>

    <footer>
      <div class="container footer-grid">
        <div>FanVerse • Biblioteca e catálogo</div>
      </div>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
