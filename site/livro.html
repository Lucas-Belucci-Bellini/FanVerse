<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livro | FanVerse</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="livro">
    <header class="topbar">
      <div class="container navbar">
        <a href="index.html" class="brand">
          <span class="brand-mark">F</span>
          <span>FanVerse</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Início</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="colecao.html?id=cronicas-da-baluarte">Coleções</a>
          <a href="loja.html">Loja</a>
          <a href="autor.html">Autor</a>
        </nav>
        <div class="nav-actions">
          <button id="theme-toggle" class="button-secondary">Modo claro</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="book-layout">
        <div class="book-cover-box">
          <img id="book-cover" src="" alt="Capa do livro" />
        </div>
        <div class="book-info">
          <h1 id="book-title">Título do livro</h1>
          <div id="book-meta" class="book-meta"></div>
          <p id="book-description" class="book-description"></p>
          <div class="price-box">
            <strong>Valor:</strong>
            <span id="book-price" class="price">R$ 0,00</span>
          </div>
          <div class="buy-actions">
            <a id="read-link" class="button" href="leitor.html?id=">Ler agora</a>
            <a id="buy-link" class="button-secondary" href="loja.html">Comprar</a>
          </div>
          <div class="meta-row" style="margin-top: 18px;">
            <span id="book-status" class="status available">Status</span>
            <span id="book-availability">Disponibilidade</span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer-grid">
        <div>FanVerse • Leitura e compra</div>
      </div>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
